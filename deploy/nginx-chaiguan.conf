# 用在阿里云 ECS 上的站点配置（备案未下来前先用 8080 端口，避免碰 80/443）
# 放到 /etc/nginx/conf.d/chaiguan.conf，然后 nginx -t && systemctl reload nginx
server {
    listen 8080;
    server_name _;                # 备案通过后改成 chaiguan555.top www.chaiguan555.top

    root /var/www/chaiguan;        # 与 deploy/README.md 里的解压目录保持一致
    index index.html;

    charset utf-8;

    # Hexo 是静态站，所有路由都是目录 + index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 静态资源长缓存（文件名不带 hash，先保守给 7 天；以后换 CDN 再加 hash 策略）
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 搜索索引和 XML 只缓存 1 小时，改文章后能较快生效
    location ~* \.(xml|json)$ {
        expires 1h;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 备案下来、证书就位后，这里再加一个 443 server 块，并把 80 的 server 改成 301 跳转 HTTPS
}
