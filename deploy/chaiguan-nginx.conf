# 由 deploy/deploy.py 上传到 /etc/nginx/sites-available/chaiguan.conf
# 备案未下来前：直接用 IP 访问（listen 80）。备案通过后把 server_name 改成域名并加 443。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/chaiguan;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Hexo 静态站：目录 + index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 样式/脚本：每次都要回源校验（304 很便宜）。文件名不带 hash，若给长缓存，
    # 改完 CSS 用户会盯着旧样式最多 7 天——2026-10-30 踩过这个坑，别改回去。
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # 图片/字体/图标：文件名固定且不常变，给 7 天
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* \.(xml|json)$ {
        expires 1h;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
