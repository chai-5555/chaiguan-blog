# 由 deploy/deploy.py 上传到 /etc/nginx/sites-available/chaiguan.conf
# 备案未下来前：直接用 IP 访问（listen 80）。备案通过后把 server_name 改成域名并加 443。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/chaiguan;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Hexo 静态站：目录 + index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 样式/脚本：每次都要回源校验（304 很便宜）。文件名不带 hash，若给长缓存，
    # 改完 CSS 用户会盯着旧样式最多 7 天——2026-10-30 踩过这个坑，别改回去。
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # 图片/字体/图标：文件名固定且不常变，给 7 天
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 音频：URL 带内容指纹（?v=<sha1 前 8 位>，由 scripts/music.js 生成），
    # 所以可以按"一年 + immutable"长缓存——这是 music.163.com 的做法
    # （实测其 CDN：Cache-Control: max-age=31536000，路径里自带 hash 段）。
    # 换歌后指纹变化 → URL 变化 → 立刻生效，不需要人工改名。
    # 用单条正则，避免嵌套 location 的匹配坑
    location ~* /audio/.+\.mp3$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 歌单本身必须新鲜（换歌后要立刻反映），体积极小，不缓存
    location = /audio/playlist.json {
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    location ~* \.(xml|json)$ {
        expires 1h;
    }

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
