# source/_data/bangumi.yml —— 番剧墙数据源（加片子只改这个文件）
#
# 页面头部（可选）：kicker = 小标签，title = 大标题，lead = 一句导语
# 每条记录：
#   title  作品名（必填）
#   orig   原名，可留空 ''
#   status 在看 / 已看 / 搁置（决定徽标颜色）
#   score  0–10 的数字，可带一位小数；写 0 或省略则显示“—”
#   year   年份数字
#   note   一句短评
#   initial 可选：占位封面里显示的字符（默认取 title 首字）
#   cover   可选：一张封面图路径，填了就替掉占位封面
#
# YAML 里的排列顺序 = 页面上的排列顺序。

page:
  kicker: BANGUMI
  title: 追番记录
  lead: 记得住名字的都在这儿；评分只对我自己负责，不影响它好不好。

items:
  - title: 葬送的芙莉莲
    orig: 葬送のフリーレン
    status: 在看
    score: 9.2
    year: 2023
    note: 用极慢的节奏丈量时间，最锋利的反而是那些什么都没发生的日常段落。

  - title: 迷宫饭
